name: Omnipolymath
options:
  preGenCommand: bash ../../scripts/ios-generate-test-tls-identity.sh && node ../../scripts/prepare-apple-mermaid.mjs
  bundleIdPrefix: ai.omnipolymathfoundation
  deploymentTarget:
    iOS: "26.2"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  ESPProvision:
    path: ThirdParty/ESPProvision
  OmnipolymathKit:
    path: ../shared/OmnipolymathKit
  Swabble:
    path: ../swabble
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 154.0.0
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    revision: cfd195c76882aa9b997560ca7cb95d72fbf5db00

schemes:
  Omnipolymath:
    shared: true
    build:
      targets:
        Omnipolymath: all
    test:
      targets:
        - OmnipolymathTests
        - OmnipolymathLogicTests
  OmnipolymathLogicTests:
    shared: true
    build:
      targets:
        OmnipolymathLogicTests: all
    test:
      targets:
        - OmnipolymathLogicTests
  OmnipolymathUITests:
    shared: true
    build:
      targets:
        OmnipolymathUITests: all
    test:
      targets:
        - OmnipolymathUITests
  OmnipolymathWatchApp:
    shared: true
    build:
      targets:
        OmnipolymathWatchApp: all
    test:
      targets:
        - OmnipolymathWatchTests

targets:
  Omnipolymath:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: ESPProvision
      - target: OmnipolymathShareExtension
        embed: true
      - target: OmnipolymathActivityWidget
        embed: true
      # A companion watch application belongs in the standard Watch bundle location.
      # PlugIns is for extension products and breaks paired watch installation.
      - target: OmnipolymathWatchApp
      - package: OmnipolymathKit
      - package: OmnipolymathKit
        product: OmnipolymathChatUI
      - package: OmnipolymathKit
        product: OmnipolymathProtocol
      - package: Swabble
        product: SwabbleKit
      - package: WebRTC
      - package: Sodium
      - sdk: AppIntents.framework
      - sdk: HealthKit.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftformat
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchApp,$SRCROOT/../shared/OmnipolymathKit/Sources/OmnipolymathChatUI,$SRCROOT/../shared/OmnipolymathKit/Sources/OmnipolymathKit,$SRCROOT/../shared/OmnipolymathKit/Sources/OmnipolymathNativeState,$SRCROOT/../shared/OmnipolymathKit/Sources/OmnipolymathProtocol,$SRCROOT/../swabble/Sources/SwabbleKit" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../../scripts/check-swift-tools.sh" swiftlint
          node "$SRCROOT/../../scripts/run-swiftlint.mts" --strict --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(OMNIPOLYMATH_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: "$(OMNIPOLYMATH_CODE_SIGN_ENTITLEMENTS)"
        CODE_SIGN_STYLE: "$(OMNIPOLYMATH_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OMNIPOLYMATH_DEVELOPMENT_TEAM)"
        OMNIPOLYMATH_ACTIVE_APP_GROUP_ID: "$(OMNIPOLYMATH_APP_GROUP_ID)"
        OMNIPOLYMATH_URL_SCHEME: omnipolymath
        PRODUCT_BUNDLE_IDENTIFIER: "$(OMNIPOLYMATH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(OMNIPOLYMATH_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: YES
        ENABLE_APP_INTENTS_METADATA_GENERATION: YES
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          OMNIPOLYMATH_ACTIVE_APP_GROUP_ID: "$(OMNIPOLYMATH_DEBUG_APP_GROUP_ID)"
          OMNIPOLYMATH_CODE_SIGN_ENTITLEMENTS: Sources/Omnipolymath.entitlements
          OMNIPOLYMATH_APNS_ENTITLEMENT_ENVIRONMENT: development
          OMNIPOLYMATH_URL_SCHEME: omnipolymath-debug
          PRODUCT_BUNDLE_IDENTIFIER: "$(OMNIPOLYMATH_DEBUG_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
          OMNIPOLYMATH_PUSH_MODE: localSandbox
          OMNIPOLYMATH_PUSH_RELAY_BASE_URL: ""
        Release:
          OMNIPOLYMATH_CODE_SIGN_ENTITLEMENTS: Sources/Omnipolymath.entitlements
          OMNIPOLYMATH_APNS_ENTITLEMENT_ENVIRONMENT: production
          OMNIPOLYMATH_PUSH_MODE: localProduction
          OMNIPOLYMATH_PUSH_RELAY_BASE_URL: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Omnipolymath
        CFBundleIconName: "$(ASSETCATALOG_COMPILER_APPICON_NAME)"
        CFBundleURLTypes:
          - CFBundleURLName: ai.omnipolymathfoundation.app
            CFBundleURLSchemes:
              - "$(OMNIPOLYMATH_URL_SCHEME)"
        CFBundleShortVersionString: "$(OMNIPOLYMATH_MARKETING_VERSION)"
        OmnipolymathCanonicalVersion: "$(OMNIPOLYMATH_IOS_VERSION)"
        OmnipolymathGitCommit: "$(OMNIPOLYMATH_GIT_COMMIT)"
        OmnipolymathBuildTimestamp: "$(OMNIPOLYMATH_BUILD_TIMESTAMP)"
        OmnipolymathAppGroupIdentifier: "$(OMNIPOLYMATH_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(OMNIPOLYMATH_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - fetch
          - location
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - "$(PRODUCT_BUNDLE_IDENTIFIER).bgrefresh"
        NSLocalNetworkUsageDescription: Omnipolymath discovers and connects to your Omnipolymath gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _omnipolymath-gw._tcp
        NSBluetoothAlwaysUsageDescription: Omnipolymath uses Bluetooth to securely set up a nearby ESP device when you choose device setup.
        NSCameraUsageDescription: Omnipolymath uses the camera when you scan a Gateway or device setup QR code or ask your paired Gateway or assistant to capture a photo or short video from this iPhone, for example to connect to your Gateway or show your assistant a document, device screen, or workspace.
        NSCalendarsUsageDescription: Omnipolymath uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsFullAccessUsageDescription: Omnipolymath uses your calendars to show events and scheduling context when you enable calendar access.
        NSCalendarsWriteOnlyAccessUsageDescription: Omnipolymath uses your calendars to add events when you enable calendar access.
        NSContactsUsageDescription: Omnipolymath uses your contacts so you can search and reference people while using the assistant.
        NSLocationWhenInUseUsageDescription: Omnipolymath uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Omnipolymath can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: Omnipolymath uses the microphone for realtime chat, voice wake, push-to-talk, and voice notes.
        NSMotionUsageDescription: Omnipolymath may use motion data to support device-aware interactions and automations.
        NSHealthShareUsageDescription: Omnipolymath reads your steps, sleep, resting heart rate, and workouts from the Apple Health app to create summaries you request and send them through your Gateway to your configured AI provider.
        NSHealthUpdateUsageDescription: Omnipolymath does not write to the Apple Health app. It uses read-only data to create summaries you request and send them through your Gateway to your configured AI provider.
        NSPhotoLibraryUsageDescription: Omnipolymath lets your assistant read photos you allow and lets you choose photos to share.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSRemindersFullAccessUsageDescription: Omnipolymath uses your reminders to list, add, and complete tasks when you enable reminders access.
        NSSpeechRecognitionUsageDescription: Omnipolymath uses on-device speech recognition for talk mode and voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        OmnipolymathPushMode: "$(OMNIPOLYMATH_PUSH_MODE)"
        OmnipolymathPushRelayBaseURL: "$(OMNIPOLYMATH_PUSH_RELAY_BASE_URL)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  OmnipolymathShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: OmnipolymathKit
      - package: OmnipolymathKit
        product: OmnipolymathProtocol
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(OMNIPOLYMATH_CODE_SIGN_IDENTITY)"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/OmnipolymathShareExtension.entitlements
        CODE_SIGN_STYLE: "$(OMNIPOLYMATH_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OMNIPOLYMATH_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        OMNIPOLYMATH_ACTIVE_APP_GROUP_ID: "$(OMNIPOLYMATH_APP_GROUP_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(OMNIPOLYMATH_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(OMNIPOLYMATH_SHARE_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          OMNIPOLYMATH_ACTIVE_APP_GROUP_ID: "$(OMNIPOLYMATH_DEBUG_APP_GROUP_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(OMNIPOLYMATH_DEBUG_SHARE_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Omnipolymath Share
        CFBundleShortVersionString: "$(OMNIPOLYMATH_MARKETING_VERSION)"
        OmnipolymathAppGroupIdentifier: "$(OMNIPOLYMATH_ACTIVE_APP_GROUP_ID)"
        CFBundleVersion: "$(OMNIPOLYMATH_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              # Match ShareViewController.maxImageAttachments; videos are not sent yet.
              NSExtensionActivationSupportsImageWithMaxCount: 3

  OmnipolymathActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/OmnipolymathActivityAttributes.swift
      # Shared continuous avatar waveform; dependency-free for widget isolation.
      - path: ../shared/OmnipolymathKit/Sources/OmnipolymathChatUI/TalkWaveformView.swift
        group: Shared
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(OMNIPOLYMATH_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(OMNIPOLYMATH_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OMNIPOLYMATH_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(OMNIPOLYMATH_ACTIVITY_WIDGET_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(OMNIPOLYMATH_ACTIVITY_WIDGET_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          PRODUCT_BUNDLE_IDENTIFIER: "$(OMNIPOLYMATH_DEBUG_ACTIVITY_WIDGET_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Omnipolymath Activity
        CFBundleShortVersionString: "$(OMNIPOLYMATH_MARKETING_VERSION)"
        CFBundleVersion: "$(OMNIPOLYMATH_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  OmnipolymathWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
        excludes:
          - Info.plist
      - path: Sources/Services/WatchSessionActivationGate.swift
        group: Sources/Services
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
      - path: Sources/Permissions/PermissionRequestBridge.swift
        group: Sources/Permissions
      - path: Sources/Voice/TalkRealtimeClientSession.swift
        group: Sources/Voice
      - path: Resources/Licenses/str0m.txt
        buildPhase: resources
      # Universal talk waveform, compiled directly to keep the watch styling local.
      - path: ../shared/OmnipolymathKit/Sources/OmnipolymathChatUI/TalkWaveformView.swift
        group: Shared
      # Universal mascot, compiled directly to keep the watch styling local.
      - path: ../shared/OmnipolymathKit/Sources/OmnipolymathChatUI/OmnipolymathMascotView.swift
        group: Shared
      - path: ../shared/OmnipolymathKit/Sources/OmnipolymathChatUI/OmnipolymathMascotAnimator.swift
        group: Shared
      - path: ../shared/OmnipolymathKit/Sources/OmnipolymathChatUI/OmnipolymathMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/OmnipolymathKit/Sources/OmnipolymathChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Fonts
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: OmnipolymathKit
        product: OmnipolymathKit
      - sdk: AppIntents.framework
      - sdk: AVFAudio.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    preBuildScripts:
      - name: Build Watch WebRTC
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin"
          "$SRCROOT/../shared/OmnipolymathWatchRTC/build.sh" \
            "$PLATFORM_NAME" "$DERIVED_FILE_DIR/WatchRTC" $ARCHS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(OMNIPOLYMATH_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(OMNIPOLYMATH_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "$(OMNIPOLYMATH_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(OMNIPOLYMATH_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OMNIPOLYMATH_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        OMNIPOLYMATH_COMPANION_APP_BUNDLE_ID: "$(OMNIPOLYMATH_APP_BUNDLE_ID)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(OMNIPOLYMATH_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(OMNIPOLYMATH_WATCH_APP_PROFILE)"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/../shared/OmnipolymathWatchRTC/include"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/OmnipolymathWatchRTC/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(DERIVED_FILE_DIR)/WatchRTC"
        OTHER_LDFLAGS: "$(inherited) -lomnipolymath_watch_rtc"
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
          CODE_SIGN_STYLE: Automatic
          OMNIPOLYMATH_COMPANION_APP_BUNDLE_ID: "$(OMNIPOLYMATH_DEBUG_APP_BUNDLE_ID)"
          PRODUCT_BUNDLE_IDENTIFIER: "$(OMNIPOLYMATH_DEBUG_WATCH_APP_BUNDLE_ID)"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Omnipolymath
        CFBundleShortVersionString: "$(OMNIPOLYMATH_MARKETING_VERSION)"
        CFBundleVersion: "$(OMNIPOLYMATH_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(OMNIPOLYMATH_COMPANION_APP_BUNDLE_ID)"
        WKApplication: true
        WKPrefersNetworkUponForeground: true
        NSLocalNetworkUsageDescription: Omnipolymath connects this Apple Watch directly to your Gateway on trusted local networks.
        NSMicrophoneUsageDescription: Omnipolymath uses the microphone for voice conversations you start on Apple Watch.
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - RedHatDisplay[wght].ttf
          - Inter[opsz,wght].ttf
          - Inter-Italic[opsz,wght].ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf

  OmnipolymathTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
      - path: ThirdParty/ESPProvision/Tests/ESPProvisionTests
        group: ESPProvisionTests
      - path: ../macos/Tests/OmnipolymathIPCTests/AsyncTestGate.swift
        group: Tests
      - path: ../macos/Tests/OmnipolymathIPCTests/DashboardHTTPFixture.swift
        group: Tests
      - path: ../macos/Tests/OmnipolymathIPCTests/TestWait.swift
        group: Tests
      - path: build/TestTLS/GatewayIngressIdentity.p12
        buildPhase: resources
      - path: ../macos/Tests/OmnipolymathIPCTests/GatewayWebSocketTestSupport.swift
        group: Tests
      - path: ../shared/OmnipolymathKit/Tests/OmnipolymathKitTests/NativeGatewayWebSocketFixture.swift
        group: Tests
      - path: ../shared/OmnipolymathKit/Tests/OmnipolymathKitTests/ChatMermaidRenderModelTests.swift
        group: Tests
      - path: ../shared/OmnipolymathKit/Tests/OmnipolymathKitTests/ChatSelectableTextViewTests.swift
        group: Tests
      - path: ../shared/OmnipolymathKit/Tests/OmnipolymathKitTests/ChatComposerTextViewIOSTests.swift
        group: Tests
      - path: ../shared/OmnipolymathKit/Tests/OmnipolymathKitTests/ChatPasteboardTests.swift
        group: Tests
      - path: ../shared/OmnipolymathKit/Tests/OmnipolymathKitTests/ChatMediaImagePreviewTests.swift
        group: Tests
      - path: WatchApp/Sources/WatchDeferredPayloadOrdering.swift
        group: WatchApp/Sources
    dependencies:
      - target: Omnipolymath
      - package: ESPProvision
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(OMNIPOLYMATH_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(OMNIPOLYMATH_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OMNIPOLYMATH_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(OMNIPOLYMATH_APP_BUNDLE_ID).tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Omnipolymath.app/Omnipolymath"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OMNIPOLYMATH_APP_TESTS"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(OMNIPOLYMATH_DEBUG_APP_BUNDLE_ID).tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(OMNIPOLYMATH_MARKETING_VERSION)"
        CFBundleVersion: "$(OMNIPOLYMATH_BUILD_VERSION)"

  OmnipolymathLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
      - path: ShareExtension/ShareDraftComposer.swift
        group: ShareExtension
      - path: ShareExtension/ShareContentExtractor.swift
        group: ShareExtension
      - path: ShareExtension/ShareComposeState.swift
        group: ShareExtension
      - path: ShareExtension/ShareAttachmentSummary.swift
        group: ShareExtension
      - path: WatchApp/Sources/WatchVoiceTurnTracker.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchInboxMessages.swift
        group: WatchApp/Sources
      - path: WatchApp/Sources/WatchMascot.swift
        group: WatchApp/Sources
      - path: ../shared/OmnipolymathKit/Sources/OmnipolymathChatUI/OmnipolymathMascotView.swift
        group: Shared
      - path: ../shared/OmnipolymathKit/Sources/OmnipolymathChatUI/OmnipolymathMascotAnimator.swift
        group: Shared
      - path: ../shared/OmnipolymathKit/Sources/OmnipolymathChatUI/OmnipolymathMascotCanvas+Accessories.swift
        group: Shared
      - path: ../shared/OmnipolymathKit/Sources/OmnipolymathChatUI/ChatTypography.swift
        group: Shared
      - path: Sources/Services/ExactOpaqueIdentifier.swift
        group: Sources/Services
    dependencies:
      - package: OmnipolymathKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(OMNIPOLYMATH_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(OMNIPOLYMATH_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OMNIPOLYMATH_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(OMNIPOLYMATH_APP_BUNDLE_ID).logic-tests"
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: "$(OMNIPOLYMATH_DEBUG_APP_BUNDLE_ID).logic-tests"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleShortVersionString: "$(OMNIPOLYMATH_MARKETING_VERSION)"
        CFBundleVersion: "$(OMNIPOLYMATH_BUILD_VERSION)"

  OmnipolymathUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: UITests
    dependencies:
      - target: Omnipolymath
    settings:
      base:
        CODE_SIGN_IDENTITY: "$(OMNIPOLYMATH_CODE_SIGN_IDENTITY)"
        CODE_SIGN_STYLE: "$(OMNIPOLYMATH_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(OMNIPOLYMATH_DEVELOPMENT_TEAM)"
