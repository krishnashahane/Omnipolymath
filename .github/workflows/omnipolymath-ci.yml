name: Omnipolymath CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnipolymath-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-firewall:
    name: Trust Firewall tests and docs lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Enable pnpm
        run: corepack enable && corepack prepare --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Trust Firewall tests
        run: pnpm vitest run extensions/trust-firewall
      - name: Lint Trust Firewall
        run: pnpm exec oxlint extensions/trust-firewall
      - name: Docs lint
        run: pnpm lint:docs

  site:
    name: Website build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit -p .
